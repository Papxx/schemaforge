[versions]
mod-version = "0.1.0"

# Fabric (https://fabricmc.net/develop)
jdk = "25"
minecraft = "26.2"
fabric-loader = "0.19.3"

# Loom (https://github.com/FabricMC/fabric-loom)
loom = "1.17-SNAPSHOT"

# Meteor (https://github.com/MeteorDevelopment/meteor-client/)
meteor = "26.2-SNAPSHOT"

# Mods
# Baritone: Meteor fork for MC 26.2 (Meteor itself still pins 26.1-SNAPSHOT, which does not load on 26.2) (https://github.com/MeteorDevelopment/baritone)
baritone = "26.2-SNAPSHOT"
# Litematica / MaLiLib for MC 26.2 (https://modrinth.com/mod/litematica, https://modrinth.com/mod/malilib)
litematica = "0.28.8"
malilib = "0.29.6"

# Testing
junit = "5.14.4"

[libraries]
# Fabric base
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }

# Meteor client
meteor-client = { module = "meteordevelopment:meteor-client", version.ref = "meteor" }

# Mods
baritone = { module = "meteordevelopment:baritone", version.ref = "baritone" }
litematica = { module = "maven.modrinth:litematica", version.ref = "litematica" }
malilib = { module = "maven.modrinth:malilib", version.ref = "malilib" }

# Testing
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
